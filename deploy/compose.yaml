# Puerto on one server: Postgres + Puerto + Caddy (automatic HTTPS) + daily
# backups. From this directory:
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
# Only Caddy publishes ports; Puerto and Postgres stay on the internal network.
name: puerto-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: puerto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: puerto
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puerto -d puerto"]
      interval: 5s
      timeout: 3s
      retries: 30

  puerto:
    build:
      context: ..
      args:
        VERSION: ${PUERTO_VERSION:-dev}
    image: puerto:${PUERTO_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://puerto:${POSTGRES_PASSWORD}@postgres:5432/puerto?sslmode=disable
      # Behind a proxy only token mode works (none refuses proxied requests).
      PUERTO_AUTH: token
      PUERTO_ADDR: 0.0.0.0:8740
      PUERTO_PUBLIC_URL: ${PUERTO_PUBLIC_URL:-https://${PUERTO_DOMAIN}}
      PUERTO_ADMIN_TOKEN: ${PUERTO_ADMIN_TOKEN:?set PUERTO_ADMIN_TOKEN in deploy/.env}
      PUERTO_CREW_TOKEN: ${PUERTO_CREW_TOKEN:?set PUERTO_CREW_TOKEN in deploy/.env}
      PUERTO_LOG_LEVEL: ${PUERTO_LOG_LEVEL:-info}
      PUERTO_SEND_PER_MINUTE: ${PUERTO_SEND_PER_MINUTE:-20}
      PUERTO_SEND_PER_HOUR: ${PUERTO_SEND_PER_HOUR:-300}
      PUERTO_SEND_PER_CHAT_MINUTE: ${PUERTO_SEND_PER_CHAT_MINUTE:-8}
    expose:
      - "8740"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      puerto:
        condition: service_healthy
    environment:
      PUERTO_DOMAIN: ${PUERTO_DOMAIN:?set PUERTO_DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily pg_dump (custom format) into ./backups, keeping BACKUP_KEEP_DAYS.
  # Dumps include the WhatsApp device keys: protect and copy them off the
  # server like any secret. Files are 0600, owned by BACKUP_UID (default
  # root; set it to your user's `id -u` to copy them without sudo).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "${BACKUP_UID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: puerto
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: puerto
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while :; do
          f=/backups/puerto-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup $$f"; else rm -f "$$f.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'puerto-*.dump' -mmin +$$((BACKUP_KEEP_DAYS * 1440)) -delete
          sleep "$$BACKUP_EVERY_SECONDS"
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
