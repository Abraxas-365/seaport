# Seaport on one server: Postgres + Seaport + Caddy (automatic HTTPS) + daily
# backups. From this directory:
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
# Only Caddy publishes ports; Seaport and Postgres stay on the internal network.
# Hosted agents (optional): SEAPORT_RUNTIME=docker in .env and
#   docker compose --profile hosting up -d --build
# adds a Docker socket proxy (only the Engine calls Seaport makes); slots run
# on the internal network `seaport-slots`, where they reach only Seaport.
name: seaport-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seaport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: seaport
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seaport -d seaport"]
      interval: 5s
      timeout: 3s
      retries: 30

  seaport:
    build:
      context: ..
      args:
        VERSION: ${SEAPORT_VERSION:-dev}
    image: seaport:${SEAPORT_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://seaport:${POSTGRES_PASSWORD}@postgres:5432/seaport?sslmode=disable
      # token (default) or iam; none refuses proxied requests. Seaport says
      # at start which settings the mode is missing.
      SEAPORT_AUTH: ${SEAPORT_AUTH:-token}
      SEAPORT_ADDR: 0.0.0.0:8740
      SEAPORT_PUBLIC_URL: ${SEAPORT_PUBLIC_URL:-https://${SEAPORT_DOMAIN}}
      # token mode
      SEAPORT_ADMIN_TOKEN: ${SEAPORT_ADMIN_TOKEN:-}
      # Seals the WhatsApp keys (and in iam mode the sessions; required
      # there). Unset: generated into the seaport_data volume on first start.
      # Keep a copy apart from the database backups either way.
      SEAPORT_SECRET_KEY: ${SEAPORT_SECRET_KEY:-}
      # Message images, sealed: /data/blobs in the seaport_data volume by
      # default; s3://bucket?region=... (AWS_* credentials) to share them.
      SEAPORT_BLOB_URL: ${SEAPORT_BLOB_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # iam mode (scripts/iamkit-provision.sh writes the IAMKIT_* values)
      IAMKIT_URL: ${IAMKIT_URL:-}
      IAMKIT_PUBLIC_URL: ${IAMKIT_PUBLIC_URL:-}
      IAMKIT_ISSUER: ${IAMKIT_ISSUER:-}
      IAMKIT_ENVIRONMENT_ID: ${IAMKIT_ENVIRONMENT_ID:-}
      IAMKIT_APPLICATION_ID: ${IAMKIT_APPLICATION_ID:-}
      IAMKIT_RESOURCE_ID: ${IAMKIT_RESOURCE_ID:-}
      IAMKIT_AUDIENCE: ${IAMKIT_AUDIENCE:-}
      IAMKIT_WEB_CLIENT_ID: ${IAMKIT_WEB_CLIENT_ID:-}
      SEAPORT_LOG_LEVEL: ${SEAPORT_LOG_LEVEL:-info}
      SEAPORT_SEND_PER_MINUTE: ${SEAPORT_SEND_PER_MINUTE:-20}
      SEAPORT_SEND_PER_HOUR: ${SEAPORT_SEND_PER_HOUR:-300}
      SEAPORT_SEND_PER_CHAT_MINUTE: ${SEAPORT_SEND_PER_CHAT_MINUTE:-8}
      SEAPORT_SEND_ORG_PER_HOUR: ${SEAPORT_SEND_ORG_PER_HOUR:-1000}
      SEAPORT_MAX_DOCKS: ${SEAPORT_MAX_DOCKS:-10}
      SEAPORT_MAX_CREW_CONNECTIONS: ${SEAPORT_MAX_CREW_CONNECTIONS:-20}
      SEAPORT_API_RATE: ${SEAPORT_API_RATE:-20}
      SEAPORT_API_BURST: ${SEAPORT_API_BURST:-60}
      # Hosted agents: off, or docker (with --profile hosting).
      SEAPORT_RUNTIME: ${SEAPORT_RUNTIME:-off}
      DOCKER_HOST: tcp://docker-proxy:2375
      SEAPORT_RUNTIME_NETWORK: seaport-slots
      # Slots reach the port (crew, MCP, model gateway) and its egress
      # proxy by the service name on seaport-slots.
      SEAPORT_AGENT_URL: http://seaport:8740
      SEAPORT_EGRESS_ADDR: ${SEAPORT_EGRESS_ADDR:-:8741}
      # Base images ("": ghcr.io/abraxas-365/seaport-<harness> of this release)
      SEAPORT_IMAGE_RNESS: ${SEAPORT_IMAGE_RNESS:-}
      SEAPORT_IMAGE_CLAUDE_CODE: ${SEAPORT_IMAGE_CLAUDE_CODE:-}
      SEAPORT_MAX_SLOTS: ${SEAPORT_MAX_SLOTS:-10}
      SEAPORT_HOST_MAX_CPUS: ${SEAPORT_HOST_MAX_CPUS:-4}
      SEAPORT_HOST_MAX_MEMORY_MB: ${SEAPORT_HOST_MAX_MEMORY_MB:-8192}
    volumes:
      - seaport_data:/data
    networks: [default, docker, slots]
    expose:
      - "8740"

  # Hosted agents: the Docker Engine API, narrowed to what Seaport uses
  # (containers, exec, images and builds, volumes, network inspect). Only
  # Seaport reaches it (network `docker`); slots never do.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    profiles: [hosting]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
      VOLUMES: 1
      NETWORKS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      seaport:
        condition: service_healthy
    environment:
      SEAPORT_DOMAIN: ${SEAPORT_DOMAIN:?set SEAPORT_DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily pg_dump (custom format) into ./backups, keeping BACKUP_KEEP_DAYS.
  # The WhatsApp keys in them are sealed with SEAPORT_SECRET_KEY (not in
  # the dumps): keep that key elsewhere, a dump is useless without it. Files are 0600, owned by BACKUP_UID (default
  # root; set it to your user's `id -u` to copy them without sudo).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "${BACKUP_UID:-0}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: seaport
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: seaport
      BACKUP_EVERY_SECONDS: ${BACKUP_EVERY_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while :; do
          f=/backups/seaport-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup $$f"; else rm -f "$$f.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'seaport-*.dump' -mmin +$$((BACKUP_KEEP_DAYS * 1440)) -delete
          sleep "$$BACKUP_EVERY_SECONDS"
        done

networks:
  default:
  docker:
    internal: true
  # Slots' only network: internal (no route out), so the egress proxy is
  # their way to the internet. Named, since Seaport names it to Docker.
  slots:
    name: seaport-slots
    internal: true

volumes:
  pgdata:
  seaport_data:
  caddy_data:
  caddy_config:
