name: seaport

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seaport
      POSTGRES_PASSWORD: seaport
      POSTGRES_DB: seaport
    ports:
      - "127.0.0.1:5449:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seaport"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
