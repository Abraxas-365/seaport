name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 8.6.12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Base images of hosted agents (images/Dockerfile), one per harness, for
  # amd64 and arm64 on native runners: each pushes its platform by digest,
  # then `manifest` joins them under the version's tags (and latest).
  images:
    strategy:
      fail-fast: false
      matrix:
        target: [rness, claude-code]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: VERSION=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/abraxas-365/seaport-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    needs: images
    strategy:
      matrix:
        target: [rness, claude-code]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag the multi-arch image
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/abraxas-365/seaport-${{ matrix.target }}
          VERSION: ${{ github.ref_name }}
        run: |
          tags=(-t "$IMAGE:${VERSION#v}")
          # pre-releases (v1.2.0-rc.1) don't move latest
          case "$VERSION" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:${VERSION#v}"
