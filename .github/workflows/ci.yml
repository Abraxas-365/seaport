name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seaport
          POSTGRES_PASSWORD: seaport
          POSTGRES_DB: seaport_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seaport"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SEAPORT_TEST_DATABASE_URL: postgres://seaport:seaport@localhost:5432/seaport_test?sslmode=disable
      # iam mode e2e: a pinned IAMKit + its Postgres via testcontainers
      # (the runner's Docker).
      SEAPORT_TEST_IAMKIT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      # Every goos/goarch goreleaser releases (.goreleaser.yaml) must
      # compile: `seaport connect` runs on people's machines.
      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./... || exit 1
          done
      # Architecture tests always run; the integration tests use the service
      # database (they wipe it, hence -p 1) and IAMKit containers. Shuffled so
      # a test that depends on another's leftovers fails here, not by luck.
      - run: go test -race -count=1 -p 1 -shuffle=on ./...

  # Native Go fuzz targets (FuzzX), 10s each, no database. scripts/fuzz.sh
  # finds them with `go test -list`; the shards run in parallel so the job
  # stays about 3 minutes. A failing input lands in testdata/fuzz/ (commit it).
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.shard }}
        env:
          FUZZ_SHARD: ${{ matrix.shard }}
        run: scripts/fuzz.sh 10s

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.6.12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # The documentation site (website/, the same steps as website.yml minus the
  # publish): its tests, the build and the rendered links, on every PR.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      SITE_BASE: /seaport
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:links

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: seaport:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: test "$(docker run --rm seaport:ci version)" = "${{ github.sha }}"

  # Base images of hosted agents: they build, keep the contract (uid 1000,
  # labels, entrypoint) and carry working harness binaries.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rness, claude-code]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: images/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: seaport-${{ matrix.target }}:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-amd64
      - name: contract
        env:
          IMAGE: seaport-${{ matrix.target }}:ci
          HARNESS: ${{ matrix.target }}
        run: |
          test "$(docker inspect -f '{{.Config.User}} {{index .Config.Labels "io.seaport.base"}} {{index .Config.Labels "io.seaport.harness"}}' "$IMAGE")" = "1000:1000 1 $HARNESS"
          test "$(docker run --rm --entrypoint seaport "$IMAGE" version)" = "${{ github.sha }}"
          case "$HARNESS" in
            rness) docker run --rm --entrypoint rness "$IMAGE" --version ;;
            claude-code)
              docker run --rm --entrypoint claude "$IMAGE" --version
              # managed settings (connector.ClaudeManaged)
              test "$(docker run --rm --entrypoint readlink "$IMAGE" /etc/claude-code)" = /tmp/seaport/claude-code
              ;;
          esac
      # The harness answers ACP as a slot runs it (hosted env, no network):
      # initialize and a new session with a model option.
      - name: acp
        run: python3 images/acp-smoke.py seaport-${{ matrix.target }}:ci ${{ matrix.target }}
